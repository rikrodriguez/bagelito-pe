name: Bagelito Guided Store Visual QA

on:
  push:
    branches:
      - feat/guided-playable-commerce-v1-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ENV: preview
      BAGELITO_VISUAL_QA_ENABLED: "true"
      PAYMENT_PROVIDER: manual
      CULQI_ENABLED: "false"
      BAGELITO_MERCHANT_REVIEW_ONLY: "true"
      BASE_URL: http://127.0.0.1:4173
      QA_OUTPUT: qa-artifacts
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build with TypeScript safety gate
        run: npm run build

      - name: Structural and launch checkout tests
        run: |
          npm run qa:static
          npm run qa:launch

      - name: Install sandbox browser (no payment secrets)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Guided desktop/mobile and physical 3D QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > qa-artifacts/preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS "$BASE_URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BASE_URL/" >/dev/null
          npm run qa:guided
          npm run qa:3d

      - name: Preserve screenshots and QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bagelito-qa-screenshots
          path: |
            qa-artifacts/
          if-no-files-found: warn
          retention-days: 5
