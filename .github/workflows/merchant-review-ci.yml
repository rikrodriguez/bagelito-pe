name: Merchant review candidate CI

on:
  push:
    branches: [fix/culqi-commercial-gaps-20261026]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merchant-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    if: github.event_name == 'push' || (github.head_ref == 'fix/culqi-commercial-gaps-20261026' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BAGELITO_MERCHANT_REVIEW_ONLY: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build and typecheck without provider credentials
        run: npm run build
