name: Instagram Agent CI

on:
  push:
    branches:
      - feature/instagram-inbox-agent
  pull_request:
    paths:
      - "src/lib/instagram/**"
      - "supabase/**"
      - "tests/instagram-*.test.mjs"
      - ".github/workflows/instagram-agent-ci.yml"

permissions:
  contents: read

concurrency:
  group: instagram-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
