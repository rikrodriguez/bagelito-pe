name: Bagelito TanStack portable slice
on:
  pull_request:
    branches: [main]
    paths:
      - "migration/ai-studio/**"
      - ".github/workflows/bagelito-ai-studio-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install source dependencies
        run: npm ci --ignore-scripts
      - name: Verify portable TypeScript domain contract
        run: node migration/ai-studio/verify-portable-slice.mjs
