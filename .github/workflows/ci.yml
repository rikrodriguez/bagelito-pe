name: Culqi sandbox draft CI

on:
  push:
    branches:
      - fix/culqi-expiry-quarantine-20261014
      - fix/culqi-charge-reconciliation-20261014
      - fix/culqi-capture-policy-20261014
  pull_request:
    branches:
      - fix/culqi-payment-coordination-20261012
      - fix/culqi-charge-reconciliation-20261014
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: culqi-sandbox-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node tests, lint and build
    if: >-
      github.event_name == 'push' ||
      ((github.event.pull_request.head.ref == 'fix/culqi-expiry-quarantine-20261014' ||
        github.event.pull_request.head.ref == 'fix/culqi-charge-reconciliation-20261014' ||
        github.event.pull_request.head.ref == 'fix/culqi-capture-policy-20261014') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CULQI_ENABLED: 'false'
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run fictitious payment and application tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build and validate types
        run: npm run build
      - name: Verify the administrative diagnostic HTTP boundary locally
        run: node tests/culqi-readonly-http.mjs
      - name: Verify the unpublished reconciliation HTTP adapter with the real parser
        run: node tests/culqi-reconciliation-http.mjs
      - name: Pull the pinned PostgreSQL fixture image
        run: docker pull --platform linux/amd64 postgres:17.11-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
      - name: Verify native status HTTP recovery with isolated real SQL transactions
        run: node tests/culqi-status-recovery-http.mjs
      - name: Verify native admin status action and the three-target boundary
        run: node tests/culqi-admin-status-http.mjs

  sql:
    name: SQL transaction tests (PostgreSQL 17)
    if: >-
      github.event_name == 'push' ||
      ((github.event.pull_request.head.ref == 'fix/culqi-expiry-quarantine-20261014' ||
        github.event.pull_request.head.ref == 'fix/culqi-charge-reconciliation-20261014' ||
        github.event.pull_request.head.ref == 'fix/culqi-capture-policy-20261014') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run SQL fixtures in an isolated PostgreSQL 17 container
        # No host networking, published ports, app credentials or writable checkout.
        # The existing runner starts a temporary cluster on container loopback.
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --user postgres \
            --env PG_BIN=/usr/lib/postgresql/17/bin \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --entrypoint bash \
            postgres:17.11-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df \
            tests/run-sql-tests.sh
