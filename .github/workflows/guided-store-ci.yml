name: Guided Store CI

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > ci-install.log 2>&1
          code=$?
          echo "$code" > ci-install.exit
          cat ci-install.log
          exit 0
      - name: Build and typecheck
        shell: bash
        run: |
          set +e
          if [ "$(cat ci-install.exit)" = "0" ]; then
            npm run typecheck > ci-build.log 2>&1
            code=$?
          else
            echo "Skipped because dependency installation failed." > ci-build.log
            code=99
          fi
          echo "$code" > ci-build.exit
          cat ci-build.log
          git diff -- src/routeTree.gen.ts > ci-route-tree.diff
          exit 0
      - name: Publish failure diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          install_code="$(cat ci-install.exit 2>/dev/null || echo missing)"
          build_code="$(cat ci-build.exit 2>/dev/null || echo missing)"
          if [ "$install_code" = "0" ] && [ "$build_code" = "0" ] && [ ! -s ci-route-tree.diff ]; then
            exit 0
          fi
          {
            echo '<!-- guided-store-ci-diagnostic -->'
            echo '### Guided Store CI diagnostic'
            echo
            echo "- install exit: `$install_code`"
            echo "- build/typecheck exit: `$build_code`"
            echo
            echo '#### build/typecheck tail'
            echo '~~~text'
            tail -n 100 ci-build.log 2>/dev/null || true
            echo '~~~'
            if [ -s ci-route-tree.diff ]; then
              echo
              echo '#### generated route-tree diff'
              echo '~~~diff'
              tail -n 120 ci-route-tree.diff
              echo '~~~'
            fi
          } > ci-comment.md
          payload="$(jq -Rs '{body: .}' < ci-comment.md)"
          curl --fail-with-body -sS             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments"             -d "$payload"
      - name: Enforce checks
        shell: bash
        run: |
          test "$(cat ci-install.exit)" = "0"
          test "$(cat ci-build.exit)" = "0"
          test ! -s ci-route-tree.diff
