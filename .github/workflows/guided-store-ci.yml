name: Guided Store CI

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > ci-install.log 2>&1
          code=$?
          echo "$code" > ci-install.exit
          cat ci-install.log
          exit 0
      - name: Build and typecheck
        shell: bash
        run: |
          set +e
          if [ "$(cat ci-install.exit)" = "0" ]; then
            npm run typecheck > ci-build.log 2>&1
            code=$?
          else
            echo "Skipped because dependency installation failed." > ci-build.log
            code=99
          fi
          echo "$code" > ci-build.exit
          cat ci-build.log
          git diff -- src/routeTree.gen.ts > ci-route-tree.diff
          exit 0
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-store-ci-logs
          path: |
            ci-install.log
            ci-install.exit
            ci-build.log
            ci-build.exit
            ci-route-tree.diff
          if-no-files-found: error
          retention-days: 3
      - name: Enforce checks
        shell: bash
        run: |
          test "$(cat ci-install.exit)" = "0"
          test "$(cat ci-build.exit)" = "0"
          test ! -s ci-route-tree.diff
